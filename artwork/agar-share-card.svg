<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#cfd4d2" stroke-width="1"/>
    </pattern>
    <radialGradient id="dish" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#162021"/><stop offset=".62" stop-color="#090d0e"/><stop offset="1" stop-color="#020405"/>
    </radialGradient>
    <radialGradient id="colonyA">
