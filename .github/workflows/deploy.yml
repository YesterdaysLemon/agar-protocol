name: production deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      confirm:
        description: Deploy the current main commit to agar.alirezaafshan.com
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: test and build production image
    if: ${{ github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && inputs.confirm) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: docker build --tag "agar-protocol:ci-${GITHUB_SHA}" .

  deploy:
    name: notify the production deploy manager
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.confirm))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: agar-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://agar.alirezaafshan.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: refuse a superseded release under the production lock
        shell: bash
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$latest_sha"
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "Refusing superseded SHA $GITHUB_SHA; main is now $latest_sha" >&2
            exit 1
          fi

      - name: request an exact-SHA deployment
        shell: bash
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          test -n "$DEPLOY_WEBHOOK_URL"
          test -n "$DEPLOY_WEBHOOK_SECRET"

          payload="$(node -e 'const payload = { event: "push", branch: "main", repo: process.env.GITHUB_REPOSITORY, sha: process.env.GITHUB_SHA }; process.stdout.write(JSON.stringify(payload));')"
          signature="$(node -e 'const crypto = require("crypto"); const payload = process.argv[1]; process.stdout.write("sha256=" + crypto.createHmac("sha256", process.env.DEPLOY_WEBHOOK_SECRET).update(payload).digest("hex"));' "$payload")"

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 900 \
            --request POST "$DEPLOY_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --header "X-Hub-Signature-256: $signature" \
            --data-binary "$payload"
